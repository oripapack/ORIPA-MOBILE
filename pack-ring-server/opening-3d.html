<!DOCTYPE html>

<style>

    background:rgba(10,13,26,.55); border:1px solid rgba(127,243,255,.28);

  #hint.off { opacity:0; pointer-events:none; }
  #resetBtn { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom));

    color:#ffd76a; font-weight:700; font-size:14px; letter-spacing:.16em; font-family:inherit;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 0 34px rgba(255,215,106,.16);
    transition:opacity .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
  #resetBtn.on { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #resetBtn:active { transform:translateX(-50%) scale(.96); }
  #cardInfo { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(14px); z-index:3; opacity:0; pointer-events:none;
    text-align:center; padding:14px 28px; border-radius:20px; min-width:230px;
    background:rgba(10,13,26,.62); border:1px solid rgba(255,215,106,.32);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 0 30px rgba(255,215,106,.12);
    transition:opacity .4s cubic-bezier(.2,.8,.2,1), transform .4s cubic-bezier(.2,.8,.2,1); }
  #cardInfo.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .ci-tier { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
  #ciTier { font-size:12px; font-weight:900; letter-spacing:.18em; color:#241a05;
    background:linear-gradient(90deg,#ffe9a8,#c98f2d); padding:3px 12px; border-radius:999px; }
  #ciStars { color:var(--tierCol,#ffd76a); font-size:14px; letter-spacing:.14em;
    text-shadow:0 0 10px var(--tierCol,rgba(255,215,106,.65)); }
  .ci-name { color:#ffffff; font-size:17px; font-weight:800; letter-spacing:.04em; }
  .ci-meta { margin-top:4px; color:#9fb0d9; font-size:12px; letter-spacing:.08em; }
  .ci-dot { margin:0 6px; opacity:.6; }
  @media (prefers-reduced-motion: reduce){ #hint,#resetBtn,#cardInfo{ transition:opacity .15s ease; } }

<script>
(function(){

var hintEl=document.getElementById('hint');

if(!window.THREE){ hintEl.textContent='3Dライブラリの読み込みに失敗しました（通信環境をご確認ください）'; return; }

/* ============ 基本設定 ============ */
var reduce=false;
try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var PW=1.68, PH=2.95, PD=0.15;
var TEAR_Y=1.185, BODY_H=2.66, BODY_CY=-0.145, STRIP_CY=1.33, CARD_Y0=0.0;
var CARD_CY=0.95, CARD_CZ=1.1, CARD_SC=1.0, SLAB_S0=0.7;
var HINT0='✨ 光るラインを横にスワイプで開封 ・ ドラッグで回転';

/* ============ Tunable CFG (override via URL query, e.g. ?tearSensitivity=500&revealDelayMs=800) ============ */
var CFG={
  /* Camera */
  camFov:42,
  camNear:0.1,
  camFar:60,
  camZMin:7.6,
  camAspectNum:1.55,
  camAspectDen:0.3839,

  particleCount:200,

  centerDur:0.75,

  glowTweenDur:1.2,

  flipDurReduced:0.3,
  revealDelayMs:1100,
  revealDelayReducedMs:200
};

/* Alias: tearSensitivity → tearWidthCap (swipe distance to complete tear) */
function applyCfgFromQuery(){
  try{
    var qs=new URLSearchParams(window.location.search||'');
    var alias={tearSensitivity:'tearWidthCap'};
    qs.forEach(function(raw,key){
      var k=alias[key]||key;
      if(!Object.prototype.hasOwnProperty.call(CFG,k)) return;
      var n=parseFloat(raw);
      if(!isNaN(n)&&isFinite(n)) CFG[k]=n;
    });
  }catch(e){}
}
applyCfgFromQuery();

/* ============ Canvas ユーティリティ ============ */
function cnv(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function ctex(c){ var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t; }
function rr(x,cx,cy,w,h,r){ x.beginPath(); x.moveTo(cx+r,cy); x.arcTo(cx+w,cy,cx+w,cy+h,r); x.arcTo(cx+w,cy+h,cx,cy+h,r); x.arcTo(cx,cy+h,cx,cy,r); x.arcTo(cx,cy,cx+w,cy,r); x.closePath(); }
function spaced(x,text,cx,cy,ls){ var i,w=[],tot=0;
  for(i=0;i<text.length;i++){ w[i]=x.measureText(text[i]).width; tot+=w[i]; }
  tot+=ls*(text.length-1);
  var px=cx-tot/2, pa=x.textAlign; x.textAlign='left';
  for(i=0;i<text.length;i++){ x.fillText(text[i],px,cy); px+=w[i]+ls; }
  x.textAlign=pa; }
function star4(x,cx,cy,r){ var q=r*0.1; x.beginPath(); x.moveTo(cx,cy-r);
  x.quadraticCurveTo(cx+q,cy-q,cx+r,cy); x.quadraticCurveTo(cx+q,cy+q,cx,cy+r);
  x.quadraticCurveTo(cx-q,cy+q,cx-r,cy); x.quadraticCurveTo(cx-q,cy-q,cx,cy-r); x.closePath(); }

/* ============ パック表面テクスチャ ============ */
function texFront(){
  var W=768,H=1350,c=cnv(W,H),x=c.getContext('2d'),g;
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#101430'); g.addColorStop(0.55,'#0b0e22'); g.addColorStop(1,'#060814');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(160,190,255,0.025)';
  for(var sy=0; sy<H; sy+=7) x.fillRect(0,sy,W,1);
  /* 「引」ウォーターマーク（PullHub＝引く） */
  x.save(); x.translate(W/2,660); x.rotate(-0.08);
  g=x.createLinearGradient(0,-300,0,300); g.addColorStop(0,'rgba(255,63,216,0.16)'); g.addColorStop(1,'rgba(55,230,255,0.12)');
  x.fillStyle=g; x.font='900 600px "Hiragino Sans","Noto Sans JP",sans-serif';
  x.textAlign='center'; x.textBaseline='middle'; x.fillText('引',0,16); x.restore();
  x.textBaseline='alphabetic';
  /* ホロ斜めストリーク */
  x.save(); x.translate(W/2,H/2); x.rotate(-0.45);
  var cols=['rgba(127,243,255,','rgba(255,255,255,','rgba(255,63,216,'];
  for(var i=0;i<6;i++){
    var bx=-560+i*190;
    g=x.createLinearGradient(bx,-1060,bx+60,1060);
    g.addColorStop(0,cols[i%3]+'0)'); g.addColorStop(0.5,cols[i%3]+'0.10)'); g.addColorStop(1,cols[i%3]+'0)');
    x.fillStyle=g; x.fillRect(bx,-1080,54,2160);
  }
  x.restore();
  /* ネオン枠 */
  g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#37e6ff'); g.addColorStop(1,'#ff3fd8');
  x.strokeStyle=g; x.lineWidth=5;
  x.shadowColor='rgba(55,230,255,0.9)'; x.shadowBlur=24; rr(x,26,26,W-52,H-52,30); x.stroke();
  x.shadowColor='rgba(255,63,216,0.8)'; x.shadowBlur=20; x.stroke();
  x.shadowBlur=0;
  x.strokeStyle='rgba(160,200,255,0.28)'; x.lineWidth=1.5; rr(x,44,44,W-88,H-88,20); x.stroke();
  x.textAlign='center';
  /* ロゴ */
  x.font='900 96px "Hiragino Sans","Noto Sans JP",sans-serif';
  x.shadowColor='rgba(55,230,255,0.95)'; x.shadowBlur=30; x.fillStyle='#ffffff';
  spaced(x,'PULLHUB',W/2,168,10);
  x.shadowBlur=0;
  x.font='700 26px "Hiragino Sans","Noto Sans JP",sans-serif';
  x.fillStyle='rgba(159,216,255,0.92)';
  spaced(x,'オリジナル・オリパ',W/2,218,9);
  /* 中央エンブレム */
  var ex=W/2, ey=672;
  g=x.createRadialGradient(ex,ey,0,ex,ey,200); g.addColorStop(0,'rgba(55,230,255,0.28)'); g.addColorStop(1,'rgba(55,230,255,0)');
  x.fillStyle=g; x.fillRect(ex-210,ey-210,420,420);
  x.save(); x.translate(ex,ey); x.rotate(0.12);
  x.fillStyle='#10132a'; rr(x,-96,-136,192,272,18); x.fill();
  g=x.createLinearGradient(-96,-136,96,136); g.addColorStop(0,'#7ff3ff'); g.addColorStop(1,'#ff3fd8');
  x.strokeStyle=g; x.lineWidth=4; x.shadowColor='rgba(127,243,255,0.8)'; x.shadowBlur=18;
  rr(x,-96,-136,192,272,18); x.stroke(); x.shadowBlur=0;
  x.restore();
  g=x.createRadialGradient(ex,ey,0,ex,ey,96); g.addColorStop(0,'#ffffff'); g.addColorStop(0.45,'#ffe9a8'); g.addColorStop(1,'rgba(255,215,106,0)');
  x.fillStyle=g; x.shadowColor='rgba(255,236,170,0.95)'; x.shadowBlur=40;
  star4(x,ex,ey,96); x.fill(); x.shadowBlur=0;
  x.fillStyle='rgba(255,255,255,0.92)';
  star4(x,ex-118,ey-92,16); x.fill(); star4(x,ex+124,ey+70,12); x.fill(); star4(x,ex+96,ey-128,9); x.fill();
  /* エディション表記 */
  x.font='900 40px "Hiragino Sans","Noto Sans JP",sans-serif';
  x.fillStyle='#ffd76a'; x.shadowColor='rgba(255,215,106,0.75)'; x.shadowBlur=18;
  spaced(x,'MIDNIGHT EDITION',W/2,976,7);
  x.shadowBlur=0;
  x.font='500 22px "Hiragino Sans","Noto Sans JP",sans-serif';
  x.fillStyle='rgba(185,198,255,0.8)';
  spaced(x,'真夜中のカードショップ',W/2,1016,6);
  /* 下部インフォ */
  x.strokeStyle='rgba(160,200,255,0.3)'; x.lineWidth=1;
  x.beginPath(); x.moveTo(70,1134); x.lineTo(W-70,1134); x.stroke();
  var bx2=76;
  x.fillStyle='rgba(235,242,255,0.9)';
  while(bx2<268){ var bw=1+Math.floor(Math.random()*4); x.fillRect(bx2,1160,bw,70); bx2+=bw+1+Math.floor(Math.random()*4); }
  x.textAlign='right';
  x.font='900 34px "Hiragino Sans","Noto Sans JP",sans-serif'; x.fillStyle='#ffffff';
  x.fillText('10 CARDS / PACK', W-72, 1188);
  x.font='500 17px "Hiragino Sans","Noto Sans JP",sans-serif'; x.fillStyle='rgba(190,205,255,0.6)';
  x.fillText('提供割合はアプリ内でご確認ください', W-72, 1218);
  x.textAlign='center';
  x.fillStyle='rgba(160,180,230,0.28)';
  for(var fy=0; fy<2; fy++){ var fx=76; while(fx<W-260){ var fw=18+Math.random()*46; x.fillRect(fx,1254+fy*14,fw,3); fx+=fw+10; } }
  return c;
}
function texBack(){
  var W=768,H=1350,c=cnv(W,H),x=c.getContext('2d'),g;
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0c1028'); g.addColorStop(1,'#060812');
  x.fillStyle=g; x.fillRect(0,0,W,H);

  x.fillStyle='rgba(140,170,255,0.07)'; x.textAlign='center';
  for(var ry=-900; ry<900; ry+=64){

  x.lineWidth=1.5; x.beginPath(); x.arc(ex,ey,168,0,Math.PI*2); x.stroke(); x.shadowBlur=0;

  x.fillStyle=g; x.shadowColor='rgba(191,234,255,0.9)'; x.shadowBlur=34;

  spaced(x,'TOKYO → WORLDWIDE',ex,ey+306,4);
  x.fillStyle='rgba(160,180,230,0.26)';
  for(var fy=0; fy<4; fy++){ var fx=96; while(fx<W-96){ var fw=16+Math.random()*54; x.fillRect(fx,1140+fy*17,fw,3); fx+=fw+9; } }
  return c;
}
function texCrimp(){
  var c=cnv(128,64),x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,64); g.addColorStop(0,'#8e96b4'); g.addColorStop(0.5,'#565d78'); g.addColorStop(1,'#7f88a8');
  x.fillStyle=g; x.fillRect(0,0,128,64);
  x.fillStyle='rgba(20,24,40,0.6)';
  for(var i=0;i<128;i+=6) x.fillRect(i,0,2,64);
  x.fillStyle='rgba(200,210,235,0.3)';
  for(var j=3;j<128;j+=6) x.fillRect(j,0,1,64);
  return c;
}
function texTorn(){
  var c=cnv(512,64),x=c.getContext('2d');
  x.clearRect(0,0,512,64);
  x.beginPath(); x.moveTo(0,64);
  var px2=0;
  while(px2<512){ var step=10+Math.random()*16; var hh=12+Math.random()*26;
    x.lineTo(px2+step/2,64-hh); x.lineTo(px2+step,64); px2+=step; }
  x.lineTo(512,64); x.closePath();
  var g=x.createLinearGradient(0,0,0,64); g.addColorStop(0,'#f2f6ff'); g.addColorStop(1,'#8a92b8');
  x.fillStyle=g; x.fill();
  x.strokeStyle='rgba(127,243,255,0.85)'; x.lineWidth=2; x.stroke();
  return c;
}
function texDash(){
  var c=cnv(512,24),x=c.getContext('2d');
  x.clearRect(0,0,512,24);
  x.shadowColor='#7ff3ff'; x.shadowBlur=7; x.fillStyle='#aef7ff';
  for(var i=6;i<488;i+=34){ rr(x,i,8,20,8,4); x.fill(); }

}
function texCardBack(){
  var W=512,H=716,c=cnv(W,H),x=c.getContext('2d'),g;
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0d1126'); g.addColorStop(1,'#070912');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.save(); x.translate(W/2,H/2); x.rotate(-0.5);
  g=x.createLinearGradient(-400,-40,400,40); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.5,'rgba(180,220,255,0.06)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(-500,-90,1000,180); x.restore();
  g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#37e6ff'); g.addColorStop(1,'#ff3fd8');
  x.strokeStyle=g; x.lineWidth=6; x.shadowColor='rgba(55,230,255,0.8)'; x.shadowBlur=16;
  rr(x,14,14,W-28,H-28,22); x.stroke(); x.shadowBlur=0;
  x.strokeStyle='rgba(160,200,255,0.3)'; x.lineWidth=1.5; rr(x,34,34,W-68,H-68,14); x.stroke();
  var ex=W/2, ey=H/2-26;
  x.save(); x.translate(ex,ey); x.rotate(Math.PI/4);
  x.strokeStyle='rgba(255,215,106,0.9)'; x.lineWidth=3; x.shadowColor='rgba(255,215,106,0.7)'; x.shadowBlur=14;
  x.strokeRect(-78,-78,156,156); x.restore(); x.shadowBlur=0;
  g=x.createRadialGradient(ex,ey,0,ex,ey,64); g.addColorStop(0,'#ffffff'); g.addColorStop(0.55,'#bfeaff'); g.addColorStop(1,'rgba(127,243,255,0)');
  x.fillStyle=g; x.shadowColor='rgba(191,234,255,0.95)'; x.shadowBlur=26;

function burst(wp,n,pal,spd,up){
  for(var i=0;i<n;i++){
    pIdx=(pIdx+1)%PN;
    pLife[pIdx]=0.55+Math.random()*0.65;
    pPos[pIdx*3]=wp.x+(Math.random()-0.5)*0.2;
    pPos[pIdx*3+1]=wp.y+(Math.random()-0.5)*0.2;
    pPos[pIdx*3+2]=wp.z+(Math.random()-0.5)*0.2;
    var a=Math.random()*Math.PI*2, el=(Math.random()-0.5)*Math.PI;
    var s=spd*(0.35+Math.random()*0.8);
    pVel[pIdx*3]=Math.cos(a)*Math.cos(el)*s;
    pVel[pIdx*3+1]=Math.sin(el)*s+up;
    pVel[pIdx*3+2]=Math.sin(a)*Math.cos(el)*s*0.7;
    var col=pal[Math.floor(Math.random()*pal.length)];
    pCol[pIdx*3]=col[0]; pCol[pIdx*3+1]=col[1]; pCol[pIdx*3+2]=col[2];
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}
function stepParticles(dt){
  var dirty=false;
  for(var i=0;i<PN;i++){
    if(pLife[i]>0){
      pLife[i]-=dt;
      pPos[i*3]+=pVel[i*3]*dt; pPos[i*3+1]+=pVel[i*3+1]*dt; pPos[i*3+2]+=pVel[i*3+2]*dt;
      pVel[i*3+1]-=CFG.particleGravity*dt;
      if(pLife[i]<=0){ pPos[i*3+1]=-999; }
      dirty=true;
    }
  }
  if(dirty) pGeo.attributes.position.needsUpdate=true;
}

/* ============ トゥイーン ============ */
var tweens=[];
function eOutCubic(k){ return 1-Math.pow(1-k,3); }
function eInOut(k){ return k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; }
function eBack(k){ var c1=1.15; return 1+(c1+1)*Math.pow(k-1,3)+c1*Math.pow(k-1,2); }
function tw(dur,fn,ease,done){ tweens.push({e:0,d:dur,f:fn,z:ease||eOutCubic,c:done}); }
function stepTweens(dt){
  for(var i=tweens.length-1;i>=0;i--){
    var t2=tweens[i]; t2.e+=dt;
    var k=t2.e/t2.d; if(k>1)k=1;
    t2.f(t2.z(k),k);
    if(k>=1){ tweens.splice(i,1); if(t2.c)t2.c(); }
  }
}

/* ============ サウンド／ハプティクス ============ */
var AC=null;
function audio(){ try{
  if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC&&AC.state==='suspended') AC.resume();
}catch(e){} }
function tone(f,dur,type,vol,delay){ if(!AC)return;
  try{ var o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=f; o.connect(g); g.connect(AC.destination);
    var t0=AC.currentTime+(delay||0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.15,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.start(t0); o.stop(t0+dur+0.06);
  }catch(e){} }
function tick(){ if(!AC)return;
  try{ var len=Math.floor(AC.sampleRate*0.05), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    var n=AC.createBufferSource(); n.buffer=b;
    var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1700+Math.random()*1400;
    var g=AC.createGain(); g.gain.value=0.09;
    n.connect(f); f.connect(g); g.connect(AC.destination); n.start();
  }catch(e){} }
function chime(){ tone(784,0.35,'sine',0.14); tone(1174.7,0.5,'sine',0.11,0.07); tone(1568,0.7,'sine',0.09,0.14); }
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

var opened=false,emerged=false,revealed=false,flipping=false,centering=false,centered=false,flapDone=false;
var progress=0,lastTickN=-1,mode=null,flashVal=0,stripFly=null,sbTok=null;
var rotT={x:0,y:0},rotC={x:0,y:0},dragVel=0,dragVelX=0,camTy=CFG.camTyIdle,cardBaseY=CARD_Y0;
var lastX=0,lastY=0,tGlobal=0;
var ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function hits(e,obj){ var r=cv.getBoundingClientRect();
  ndc.x=((e.clientX-r.left)/r.width)*2-1;
  ndc.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  return ray.intersectObject(obj,true).length>0; }
function hint(s){ hintEl.textContent=s; }

cv.addEventListener('pointerdown',function(e){
  audio();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  lastX=e.clientX; lastY=e.clientY; dragVel=0; dragVelX=0;
  if(!opened && hits(e,tearHit)){
    mode='tear';
    if(sbTok){ sbTok.dead=true; sbTok=null; }
  }
  else if(emerged && !revealed && !flipping && hits(e,cardMesh)){ mode=null; flip(); }
  else { mode='rotate'; }
});
cv.addEventListener('pointermove',function(e){
  if(!mode) return;
  var dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  if(mode==='tear'){
    if(opened) return;
    progress+=Math.abs(dx)/Math.min(cv.clientWidth*CFG.tearWidthFrac,CFG.tearWidthCap);
    if(progress>1) progress=1;
    var tk=Math.floor(progress*9);
    if(tk!==lastTickN){ lastTickN=tk; tick(); buzz(6); }
    if(Math.abs(dx)>1){
      var wp=new THREE.Vector3(-0.68+1.24*progress,TEAR_Y,ZLINE+0.05);
      packRoot.localToWorld(wp);
      burst(wp,CFG.burstTearN,rarityPal(),CFG.burstTearSpd,CFG.burstTearUp);
    }
    if(progress>=1) openPack();
  } else {
    rotT.y+=dx*CFG.rotScaleY;
    rotT.x+=dy*CFG.rotScaleX;
    if(rotT.x>CFG.rotXClamp)rotT.x=CFG.rotXClamp; if(rotT.x<-CFG.rotXClamp)rotT.x=-CFG.rotXClamp;
    dragVel=dx*CFG.rotScaleY;
    dragVelX=dy*CFG.rotScaleX;
  }
});
function endPointer(){
  if(mode==='tear' && !opened && progress>0){
    var p0=progress, tok={dead:false}; sbTok=tok;
    tw(CFG.tearSnapBackSec,function(k){ if(tok.dead)return; progress=p0*(1-k); },eOutCubic);
  }
  mode=null;
}

      var wp=cardGroup.getWorldPosition(new THREE.Vector3());
      burst(wp,CFG.burstFlipN,rarityPal(),CFG.burstFlipSpd,CFG.burstFlipUp);
      tone(1318.5,0.5,'sine',0.15); tone(1975.5,0.7,'sine',0.09,0.09);
      buzz([8,30,20]);
    }
  },eInOut,function(){
    flipping=false; revealed=true;
    hintEl.classList.add('off');
    if(!EMBED){ resetBtn.classList.add('on'); }
    infoEl.classList.add('on');
    if(EMBED){ setTimeout(postRevealDone, reduce?CFG.revealDelayReducedMs:CFG.revealDelayMs); }
  });
}
function resetAll(){
  opened=false; emerged=false; revealed=false; flipping=false;
  centering=false; centered=false; flapDone=false;
  progress=0; lastTickN=-1; stripFly=null;
  if(sbTok){ sbTok.dead=true; sbTok=null; }
  if(emTok){ emTok.dead=true; emTok=null; }
  rotT.x=0; rotT.y=0; rotC.x=0; rotC.y=0; dragVel=0; dragVelX=0;
  packRoot.rotation.set(0,0,0);
  stripHinge.rotation.set(0,0,0);
  openCurl=1; windA=0; windEff=0; stripDirty=true;
  stripGroup.position.set(STRIP_LX,STRIP_LY,0); stripGroup.rotation.set(0,0,0); stripGroup.visible=true;
  setStripOpacity(1);
  tornF.visible=false; tornBk.visible=false;
  tearLine.visible=true; tearMat.opacity=0.9;
  tearLine.position.x=TEAR_X0; tearLine.scale.x=(0.56-TEAR_X0)/1.30;
  slitGlow.material.opacity=0; leakLight.intensity=0;
  for(var rz=0;rz<rayMats.length;rz++){ rayMats[rz].opacity=0; rays[rz].scale.y=1; }
  bodyGroup.visible=true; bodyGroup.position.set(0,BODY_CY,0); bodyGroup.rotation.set(0,0,0);
  packRoot.add(cardGroup); cardGroup.scale.set(SLAB_S0,SLAB_S0,SLAB_S0); cardGroup.visible=false;
  cardBaseY=CARD_Y0; cardGroup.position.set(0,CARD_Y0,0); cardGroup.rotation.set(0,0,0);
  cardInner.rotation.y=Math.PI;
  cardFrontM.map=cardBackTex;
  glow.visible=false; glow.scale.set(0.01,0.01,1); glow.material.opacity=CFG.glowOpacity0;
  var c0=camTy; tw(0.6,function(k){ camTy=c0+(CFG.camTyIdle-c0)*k; },eInOut);
  hint(HINT0); hintEl.classList.remove('off');
  resetBtn.classList.remove('on');
  infoEl.classList.remove('on');
  buzz(8);
}
resetBtn.addEventListener('click',resetAll);

/* ============ メインループ ============ */
applyCardInfo(); loadPhoto();
var clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  var dt=clock.getDelta(); if(dt>0.033)dt=0.033;
  tGlobal+=dt;
  tUniform.value=tGlobal;
  lC.position.set(Math.cos(tGlobal*0.6)*4.2, 1.6+Math.sin(tGlobal*0.4)*1.2, 2.6+Math.sin(tGlobal*0.6)*1.5);
  lM.position.set(Math.cos(tGlobal*0.5+Math.PI)*4.2, 0.6+Math.cos(tGlobal*0.35), 2.4+Math.cos(tGlobal*0.5+Math.PI)*1.5);
  if(mode!=='rotate'){
    if(!centered&&!centering){
      dragVel=dragVel*0.90-rotT.y*0.016; rotT.y+=dragVel;
      dragVelX=dragVelX*0.90-rotT.x*0.016; rotT.x+=dragVelX;
    } else {
      rotT.y+=dragVel; dragVel*=0.93;
    }
  }
  var sm=1-Math.exp(-10*dt);
  rotC.x+=(rotT.x-rotC.x)*sm; rotC.y+=(rotT.y-rotC.y)*sm;
  var sway=reduce?0:Math.sin(tGlobal*0.35)*0.05;
  if(!centering&&!centered){ packRoot.rotation.set(rotC.x,rotC.y+sway,0); }
  packRoot.position.y=-0.15+(reduce?0:Math.sin(tGlobal*1.1)*0.05);
  var tearAmt=opened?1:progress;
  if(!opened){
    var op=0.45+0.3*(0.5+0.5*Math.sin(tGlobal*3))+0.5*progress;
    tearMat.opacity=op>1?1:op;
    var xF2=TEAR_X0+TEAR_SPAN*progress;
    tearLine.position.x=xF2;
    tearLine.scale.x=Math.max(0.001,(0.56-xF2)/1.30);
    spark.visible=(progress>0.001)&&(mode==='tear');
    if(spark.visible){
      spark.position.set(TEAR_X0+TEAR_SPAN*progress,TEAR_Y,ZLINE+0.05);
      var ss=0.42+0.14*Math.sin(tGlobal*30);
      spark.scale.set(ss,ss,1);
    }
    slitGlow.material.opacity=progress*0.95;
    leakLight.intensity=progress*2.0;
  }
  if(bodyGroup.visible){
    if(tearAmt>0.001||stripDirty){
      windEff=opened?windA:(reduce?0:progress*0.4);
      deformStrip(stripMesh.geometry,stripOrig,0,tearAmt);
      deformStrip(tabTop.geometry,tabOrig,0.23,tearAmt);
      stripDirty=tearAmt>0.001;
    }
    slitGlow.scale.x=Math.max(0.02,tearAmt);
    leakLight.position.x=TEAR_X0+TEAR_SPAN*tearAmt*0.5;
  }
  if(opened&&bodyGroup.visible){
    var fl=0.75+0.25*Math.sin(tGlobal*13)+0.1*Math.sin(tGlobal*29);
    slitGlow.material.opacity=0.85*fl;
    leakLight.intensity=2.6*fl+(flashVal>0.2?flashVal:0);
    for(var rq=0;rq<rayMats.length;rq++){
      rayMats[rq].opacity=(0.5+0.3*Math.sin(tGlobal*11+rq*2.1))*(reduce?0.5:1);
      rays[rq].scale.y=0.9+0.12*Math.sin(tGlobal*7+rq);
    }
  }
  if(emerged&&!centering&&!centered){
    cardGroup.position.y=cardBaseY+(reduce?0:Math.sin(tGlobal*1.5)*0.05);
    cardGroup.rotation.z=reduce?0:Math.sin(tGlobal*0.9)*0.02;
  }
  if(centered){
    cardGroup.position.y=CARD_CY+(reduce?0:Math.sin(tGlobal*1.5)*0.05);
    cardGroup.rotation.set(rotC.x, rotC.y+sway*0.6, reduce?0:Math.sin(tGlobal*0.9)*0.02);
  }
  if(emerged && revealed && !reduce && Math.random()<CFG.ambientSparkChance){
    var wp2=new THREE.Vector3((Math.random()-0.5)*1.3,(Math.random()-0.5)*1.9,0.1);
    cardGroup.localToWorld(wp2);
    burst(wp2,1,rarityPal(),0.35,0.35);
  }
  flashL.intensity=flashVal; flashVal*=Math.exp(-dt*CFG.flashDecay);
  stepParticles(dt);
  stars.rotation.y+=dt*0.01;
  stepTweens(dt);
  camera.position.set(0,CFG.camEyeY,camZ);
  camera.lookAt(0,camTy,0);
  renderer.render(scene,camera);
}

/* ============ Pull Hub embed bridge (WebView / iframe) ============ */
var EMBED=false;
try{
  var __qs=new URLSearchParams(window.location.search||'');
  EMBED=__qs.get('embed')==='1';
}catch(e){ EMBED=false; }

function postRevealDone(){
  if(window.__PH_REVEAL_POSTED__) return;
  window.__PH_REVEAL_POSTED__=true;
  var msg=JSON.stringify({type:'revealDone'});
  try{
    var bridge=window.ReactNativeWebView;
    if(bridge&&typeof bridge.postMessage==='function') bridge.postMessage(msg);
  }catch(e){}
  try{ window.parent&&window.parent.postMessage(msg,'*'); }catch(e){}
}

function mapTierToRarity(tier){
  var t=(tier||'').toLowerCase();
  if(t==='mythic') return 5;
  if(t==='legendary') return 4;
  if(t==='epic') return 3;
  if(t==='rare') return 2;
  if(t==='common'||t==='uncommon'||t==='base') return 1;
  return 3;
}

function applyEmbedParams(){
  if(!EMBED) return;
  try{
    var qs=new URLSearchParams(window.location.search||'');
    var tier=qs.get('tier');
    var card=qs.get('card');
    var patch={};
    if(tier) patch.rarity=mapTierToRarity(tier);
    if(card) patch.name=String(card).slice(0,120);
    if(Object.keys(patch).length) window.setCard(patch);
  }catch(e){}
  /* Production: no replay / prototype chrome */
  try{
    resetBtn.style.display='none';
    var brand=document.getElementById('brand');
    if(brand){ var bs=brand.querySelector('.bs'); if(bs) bs.textContent='PACK OPENING'; }
  }catch(e){}
}

/** Skip → finish open + flip ASAP, then bridge to app. */
window.__PH_SKIP_OPEN__=function(){
  try{
    if(!opened){ openPack(); }
    if(!emerged){ emerge(); }
    if(!centered){
      try{ centerCard(); }catch(e){}
    }
    if(!revealed){
      /* Force reveal without waiting for tap */
      if(!flipping){
        flipping=true;
        cardFrontM.map=cardFaceTex;
        cardInner.rotation.y=0;
        flipping=false; revealed=true;
        hintEl.classList.add('off');
        infoEl.classList.add('on');
      }
    }
  }catch(e){}
  postRevealDone();
};

window.addEventListener('message',function(ev){
  try{
    var data=typeof ev.data==='string'?JSON.parse(ev.data):ev.data;
    if(data&&data.type==='skip') window.__PH_SKIP_OPEN__();
  }catch(e){}
});

applyEmbedParams();
applyCardInfo();

loop();
})();
</script>
