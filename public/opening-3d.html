<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>Pull Hub | Tokyo Terminal Pack Opening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Schibsted+Grotesk:wght@400;500;700&family=Spline+Sans+Mono:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --f-display:"Fraunces",serif;
    --f-body:"Schibsted Grotesk",system-ui,sans-serif;
    --f-data:"Spline Sans Mono",ui-monospace,monospace;
    --f-jp:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body {
    background:#080d1b;
    font-family:var(--f-body);
    user-select:none; -webkit-user-select:none;
  }
  body::before {
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(55% 38% at 14% 4%, rgba(52,91,231,.18), transparent 74%),
      radial-gradient(46% 34% at 90% 92%, rgba(85,212,194,.09), transparent 76%),
      linear-gradient(180deg,#0b1224 0%,#080d1b 58%,#060a14 100%);
  }
  body::after {
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.45;
    background-image:linear-gradient(rgba(99,124,184,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(99,124,184,.045) 1px,transparent 1px);
    background-size:32px 32px;
  }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; z-index:1; }
  #brand { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:18px; z-index:3; pointer-events:none; }
  .bw { font-family:var(--f-display); font-optical-sizing:auto; font-weight:500; font-size:20px; letter-spacing:-0.02em; color:#f5f0e6;
    text-shadow:0 0 16px rgba(52,91,231,.34); }
  .bs { font-family:var(--f-data); font-size:9px; letter-spacing:.18em; color:#7b8aac; margin-top:4px; }
  #hint { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom));
    transform:translateX(-50%); z-index:3; padding:10px 16px; border-radius:8px;
    background:rgba(12,20,40,.88); border:1px solid rgba(90,116,180,.48);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    color:#d8dfef; font-family:var(--f-data); font-size:10.5px; letter-spacing:.11em; white-space:nowrap;
    box-shadow:0 0 28px rgba(52,91,231,.13); transition:opacity .3s ease, transform .25s ease, background .25s ease, border-color .25s ease;
    pointer-events:none; }
  #hint.off { opacity:0; pointer-events:none; }
  #hint.continue {
    pointer-events:auto; cursor:pointer;
    padding:12px 22px; border-radius:999px;
    background:rgba(12,20,40,.72); border:1px solid rgba(191,250,255,.38);
    font-family:var(--f-body); color:#e8fbff; letter-spacing:.04em; font-weight:700;
    box-shadow:0 0 24px rgba(127,243,255,.18), inset 0 0 20px rgba(52,91,231,.12);
  }
  #hint.continue:hover { background:rgba(18,28,52,.88); border-color:rgba(191,250,255,.55); }
  #hint.continue:active { transform:translateX(-50%) scale(.97); }
  #c, #brand, #hint, #cardInfo, #tearCue {
    transition: opacity .45s cubic-bezier(.4,0,.2,1);
  }
  body.ph-exiting #c,
  body.ph-exiting #brand,
  body.ph-exiting #hint,
  body.ph-exiting #cardInfo,
  body.ph-exiting #tearCue { opacity:0 !important; pointer-events:none !important; }
  #resetBtn { position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(10px); z-index:3; opacity:0; pointer-events:none;
    padding:13px 30px; border-radius:8px; border:1px solid rgba(224,180,90,.58);
    background:#151c2d;
    color:#e0b45a; font-weight:700; font-size:13px; letter-spacing:.04em; font-family:var(--f-body);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    box-shadow:0 0 34px rgba(255,215,106,.16);
    transition:opacity .35s cubic-bezier(.2,.8,.2,1), transform .35s cubic-bezier(.2,.8,.2,1); cursor:pointer; }
  #resetBtn.on { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #resetBtn:active { transform:translateX(-50%) scale(.96); }
  #cardInfo { position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(14px); z-index:3; opacity:0; pointer-events:none;
    text-align:center; padding:14px 28px; border-radius:10px; min-width:250px;
    background:rgba(12,20,40,.92); border:1px solid rgba(224,180,90,.38);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    box-shadow:0 0 30px rgba(255,215,106,.12);
    transition:opacity .4s cubic-bezier(.2,.8,.2,1), transform .4s cubic-bezier(.2,.8,.2,1); }
  #cardInfo.on { opacity:1; transform:translateX(-50%) translateY(0); }
  .ci-tier { display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:6px; }
  #ciTier { font-family:var(--f-body); font-size:11px; font-weight:700; letter-spacing:.08em; color:#080d1b;
    background:#e0b45a; padding:4px 12px; border-radius:4px; }
  #ciStars { color:var(--tierCol,#55d4c2); font-family:var(--f-data); font-size:9px; letter-spacing:.1em;
    text-shadow:0 0 10px var(--tierCol,rgba(85,212,194,.55)); }
  .ci-name { font-family:var(--f-display); font-optical-sizing:auto; color:#f5f0e6; font-size:17px; font-weight:500; letter-spacing:-0.02em; }
  .ci-meta { margin-top:5px; color:#7b8aac; font-family:var(--f-data); font-size:10px; letter-spacing:.08em; }
  .ci-dot { margin:0 6px; opacity:.6; }
  /* Off-pack tear cue — quiet HUD; arrow slides with glow, no opacity thrash. */
  #tearCue {
    position:fixed; left:0; top:0; z-index:3; pointer-events:none;
    opacity:0;
    transition:opacity .3s ease;
  }
  #tearCue.on { opacity:1; }
  #tearCue.on.swiping { opacity:0; }
  .tear-cue-inner {
    display:flex; align-items:center; gap:6px;
    padding:4px 2px 4px 4px;
  }
  .tear-cue-label {
    font-family:var(--f-data);
    font-size:12px; font-weight:600; letter-spacing:.18em;
    color:#d5eef8;
    text-shadow:
      0 0 3px rgba(191,250,255,.55),
      0 0 8px rgba(127,243,255,.35);
  }
  .tear-cue-chev {
    width:28px; height:20px; flex:0 0 auto;
    filter:
      drop-shadow(0 0 3px rgba(191,250,255,.55))
      drop-shadow(0 0 8px rgba(127,243,255,.35));
  }
  #tearCue.on:not(.swiping) .tear-cue-chev {
    animation:tearCueArrow 1.35s ease-in-out infinite;
  }
  .tear-cue-chev svg { display:block; width:100%; height:100%; overflow:visible; }
  .tear-cue-chev path { stroke:#e8fbff; stroke-width:2; }
  /* Bigger slide only — steady glow, no fade pulse. */
  @keyframes tearCueArrow {
    0%,100% { transform:translateX(0); }
    50% { transform:translateX(12px); }
  }
  #tearCue.hot:not(.swiping) .tear-cue-label {
    color:#eef9ff;
    text-shadow:
      0 0 4px rgba(191,250,255,.7),
      0 0 10px rgba(127,243,255,.45);
  }
  #tearCue.hot:not(.swiping) .tear-cue-chev {
    filter:
      drop-shadow(0 0 4px rgba(191,250,255,.7))
      drop-shadow(0 0 10px rgba(127,243,255,.45));
  }
  @media (prefers-reduced-motion: reduce){
    #hint,#resetBtn,#cardInfo,#tearCue{ transition:opacity .15s ease; }
    #tearCue.on:not(.swiping) .tear-cue-chev { animation:none; }
  }
</style>
</head>
<body>
<div id="brand"><div class="bw">PULL.HUB</div><div class="bs">TOKYO TERMINAL / LIVE</div></div>
<div id="hint">SWIPE THE SEAL TO OPEN · DRAG TO ROTATE</div>
<div id="tearCue" aria-hidden="true">
  <div class="tear-cue-inner">
    <span class="tear-cue-label">SWIPE</span>
    <span class="tear-cue-chev" aria-hidden="true">
      <svg viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 11h18" stroke="#bffaff" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M14 4.5L22.5 11L14 17.5" stroke="#bffaff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>
</div>
<button id="resetBtn">OPEN AGAIN</button>
<div id="cardInfo">
  <div class="ci-tier"><span id="ciTier">BASE</span><span id="ciStars">TIER / PULL RECORD</span></div>
  <div class="ci-name" id="ciName">CARD ART PENDING</div>
  <div class="ci-meta"><span id="ciYear">PULL RECORD</span><span class="ci-dot">/</span><span id="ciGrade">GRADE PENDING</span></div>
</div>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var hintEl=document.getElementById('hint');
var resetBtn=document.getElementById('resetBtn');
var infoEl=document.getElementById('cardInfo');
var tearCueEl=document.getElementById('tearCue');
if(!window.THREE){ hintEl.textContent='3D SCENE UNAVAILABLE · USE STANDARD OPENING'; return; }

/* ============ 基本設定 ============ */
var reduce=false;
try{ reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
var PW=1.68, PH=2.95, PD=0.15;
/* Top flap + body must share one height split so UVs match the mesh (keeps neon/holo on the strip). */
var STRIP_H=0.24, BODY_H=PH-STRIP_H, BODY_CY=-0.145;
var TEAR_Y=BODY_CY+BODY_H*0.5;
var STRIP_CY=TEAR_Y+STRIP_H*0.5;
var TAB_TOP_Y=STRIP_H*0.5+0.02;
var CARD_Y0=0.0;
var CARD_CY=0.95, CARD_CZ=1.1, CARD_SC=1.0, SLAB_S0=0.7;
var HINT0='SWIPE THE SEAL TO OPEN · DRAG TO ROTATE';

/* ============ Tunable CFG (override via URL query, e.g. ?tearSensitivity=500&revealDelayMs=800) ============ */
var CFG={
  /* Camera */
  camFov:42,
  camNear:0.1,
  camFar:60,
  camZMin:7.6,
  camAspectNum:1.55,
  camAspectDen:0.3839,
  camEyeY:0.55,
  camTyIdle:0.15,
  camTyOpen:0.8,
  camTyCenter:0.75,

  /* Tear / rotate gesture */
  tearWidthFrac:0.5,
  tearWidthCap:420,
  rotScaleY:0.006,
  rotScaleX:0.0045,
  rotXClamp:0.42,
  /** Post-reveal card inspect limits (±45°). */
  inspectClamp:0.785,
  inspectScaleY:0.0075,
  inspectScaleX:0.006,
  /** Background tap-to-continue: max finger travel (px) still counts as a tap. */
  tapSlopPx:5,
  tearSnapBackSec:0.4,
  exitFadeMs:480,
  exitFadeReducedMs:160,

  /* Flash / glow */
  flashOnOpen:3.5,
  flashOnFlip:3,
  flashDecay:5.2,
  glowPeakScale:3.8,
  glowOpacity0:0.85,
  glowOpacityFade:0.35,

  /* Particles */
  particleCount:200,
  particleSize:0.13,
  particleGravity:2.2,
  burstTearN:2,
  burstTearSpd:0.9,
  burstTearUp:0.6,
  burstOpenN:36,
  burstOpenSpd:2.6,
  burstOpenUp:1.8,
  burstFlipN:38,
  burstFlipSpd:2.6,
  burstFlipUp:0.8,
  ambientSparkChance:0.045,

  /* Sequence timing (sec unless *Ms) */
  flapDur:0.5,
  flapDurReduced:0.25,
  tearFadeDur:0.3,
  camOpenDur:0.45,
  packExitDelayMs:180,
  packExitDelayReducedMs:40,
  emergeDelayMs:220,
  emergeDelayReducedMs:60,
  packExitDur:0.6,
  packExitDurReduced:0.28,
  emergeDur:0.6,
  emergeDurReduced:0.4,
  centerDelayMs:430,
  centerDelayReducedMs:240,
  centerDur:0.75,
  centerDurReduced:0.35,
  glowTweenDur:1.2,
  flipDur:0.78,
  flipDurReduced:0.3,
  revealDelayMs:1100,
  revealDelayReducedMs:200
};

/* Alias: tearSensitivity → tearWidthCap (swipe distance to complete tear) */
function applyCfgFromQuery(){
  try{
    var qs=new URLSearchParams(window.location.search||'');
    var alias={tearSensitivity:'tearWidthCap'};
    qs.forEach(function(raw,key){
      var k=alias[key]||key;
      if(!Object.prototype.hasOwnProperty.call(CFG,k)) return;
      var n=parseFloat(raw);
      if(!isNaN(n)&&isFinite(n)) CFG[k]=n;
    });
  }catch(e){}
}
applyCfgFromQuery();

/* ============ Canvas ユーティリティ ============ */
function cnv(w,h){ var c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function ctex(c){ var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=8; return t; }
/* N2 faces — same stack as App.tsx / sg.font (Fraunces / Schibsted / Spline / Zen Kaku). */
function fDisplay(px){ return '500 '+px+'px "Fraunces",serif'; }
function fBody(w,px){ return w+' '+px+'px "Schibsted Grotesk",sans-serif'; }
function fData(w,px){ return w+' '+px+'px "Spline Sans Mono",ui-monospace,monospace'; }
function fJp(px){ return '500 '+px+'px "Zen Kaku Gothic New",sans-serif'; }
function rr(x,cx,cy,w,h,r){ x.beginPath(); x.moveTo(cx+r,cy); x.arcTo(cx+w,cy,cx+w,cy+h,r); x.arcTo(cx+w,cy+h,cx,cy+h,r); x.arcTo(cx,cy+h,cx,cy,r); x.arcTo(cx,cy,cx+w,cy,r); x.closePath(); }
function spaced(x,text,cx,cy,ls){ var i,w=[],tot=0;
  for(i=0;i<text.length;i++){ w[i]=x.measureText(text[i]).width; tot+=w[i]; }
  tot+=ls*(text.length-1);
  var px=cx-tot/2, pa=x.textAlign; x.textAlign='left';
  for(i=0;i<text.length;i++){ x.fillText(text[i],px,cy); px+=w[i]+ls; }
  x.textAlign=pa; }
function star4(x,cx,cy,r){ var q=r*0.1; x.beginPath(); x.moveTo(cx,cy-r);
  x.quadraticCurveTo(cx+q,cy-q,cx+r,cy); x.quadraticCurveTo(cx+q,cy+q,cx,cy+r);
  x.quadraticCurveTo(cx-q,cy+q,cx-r,cy); x.quadraticCurveTo(cx-q,cy-q,cx,cy-r); x.closePath(); }

/* ============ パック表面テクスチャ ============ */
function texFront(){
  var W=768,H=1350,c=cnv(W,H),x=c.getContext('2d'),g;
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#11151f'); g.addColorStop(0.55,'#080b12'); g.addColorStop(1,'#03050a');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(123,138,172,0.16)';
  for(var dy=270;dy<1160;dy+=38){ for(var dx=70;dx<W-70;dx+=38){ x.beginPath();x.arc(dx,dy,2.4,0,Math.PI*2);x.fill(); } }
  /* Restrained foil streaks. */
  x.save(); x.translate(W/2,H/2); x.rotate(-0.45);
  var cols=['rgba(85,212,194,','rgba(255,255,255,','rgba(52,91,231,'];
  for(var i=0;i<6;i++){
    var bx=-560+i*190;
    g=x.createLinearGradient(bx,-1060,bx+60,1060);
    g.addColorStop(0,cols[i%3]+'0)'); g.addColorStop(0.5,cols[i%3]+'0.10)'); g.addColorStop(1,cols[i%3]+'0)');
    x.fillStyle=g; x.fillRect(bx,-1080,54,2160);
  }
  x.restore();
  /* Tokyo Terminal edge seal. */
  g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#345be7'); g.addColorStop(1,'#55d4c2');
  x.strokeStyle=g; x.lineWidth=5;
  x.shadowColor='rgba(52,91,231,0.78)'; x.shadowBlur=24; rr(x,26,26,W-52,H-52,22); x.stroke();
  x.shadowColor='rgba(85,212,194,0.52)'; x.shadowBlur=18; x.stroke();
  x.shadowBlur=0;
  x.strokeStyle='rgba(123,138,172,0.42)'; x.lineWidth=1.5; rr(x,44,44,W-88,H-88,16); x.stroke();
  x.textAlign='center';
  /* Clean foil header — tear cue is the off-pack DOM arrow, not art on the pack. */
  x.font=fDisplay(76);
  x.shadowColor='rgba(52,91,231,0.75)'; x.shadowBlur=22; x.fillStyle='#f5f0e6';
  spaced(x,'PULL HUB',W/2,158,8);
  x.shadowBlur=0;
  x.font=fData(500,22); x.fillStyle='#7b8aac';
  spaced(x,'TOKYO TERMINAL / SERIES 01',W/2,208,6);

  /* Physical label system from the Tokyo Pack art direction. */
  x.fillStyle='#f5f0e6'; rr(x,82,350,W-164,408,20); x.fill();
  x.fillStyle='#080d1b'; x.textAlign='left';
  x.font=fDisplay(82);
  x.fillText('TOKYO',118,492); x.fillText('PACK 01',118,582);
  x.font=fData(500,17);
  spaced(x,'DIGITAL PACK / REAL CARD / YOURS',W/2,642,3);
  x.fillStyle='#55d4c2'; rr(x,82,648,418,110,0); x.fill();
  x.fillStyle='#f5f0e6'; x.font=fBody(700,34);
  x.fillText('TOKYO',112,708);
  x.fillStyle='#ff5e57'; rr(x,500,504,184,254,10); x.fill();
  x.fillStyle='#f5f0e6'; x.font=fData(600,24);
  x.textAlign='center'; x.fillText('01',592,558);
  for(var si=0;si<5;si++){ x.save();x.translate(520+si*31,690);x.rotate(-0.5);x.fillRect(0,0,14,74);x.restore(); }
  x.strokeStyle='#7d4ce6'; x.lineWidth=5; x.beginPath(); x.arc(586,906,82,0,Math.PI*2); x.stroke();
  x.lineWidth=2; x.beginPath(); x.arc(586,906,46,0,Math.PI*2); x.stroke();
  x.beginPath();x.moveTo(504,906);x.lineTo(668,906);x.moveTo(586,824);x.lineTo(586,988);x.stroke();
  x.fillStyle='#e0b45a'; x.font=fData(600,34); x.textAlign='left';
  x.fillText('24 / 7 OPEN',86,940);
  /* 下部インフォ */
  x.strokeStyle='rgba(160,200,255,0.3)'; x.lineWidth=1;
  x.beginPath(); x.moveTo(70,1134); x.lineTo(W-70,1134); x.stroke();
  var bx2=76;
  x.fillStyle='rgba(235,242,255,0.9)';
  while(bx2<268){ var bw=1+Math.floor(Math.random()*4); x.fillRect(bx2,1160,bw,70); bx2+=bw+1+Math.floor(Math.random()*4); }
  x.textAlign='right';
  x.font=fBody(700,32); x.fillStyle='#f5f0e6';
  x.fillText('PULL RECORD INCLUDED', W-72, 1188);
  x.font=fData(500,17); x.fillStyle='rgba(123,138,172,0.92)';
  x.fillText('VIEW ODDS BEFORE OPENING', W-72, 1218);
  x.textAlign='center';
  x.fillStyle='rgba(160,180,230,0.28)';
  for(var fy=0; fy<2; fy++){ var fx=76; while(fx<W-260){ var fw=18+Math.random()*46; x.fillRect(fx,1254+fy*14,fw,3); fx+=fw+10; } }
  return c;
}
function texBack(){
  var W=768,H=1350,c=cnv(W,H),x=c.getContext('2d'),g;
  g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,'#0c1028'); g.addColorStop(1,'#060812');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.save(); x.translate(W/2,H/2); x.rotate(-0.5);
  x.font=fData(500,24);
  x.fillStyle='rgba(123,138,172,0.08)'; x.textAlign='center';
  for(var ry=-900; ry<900; ry+=64){
    var off=((ry/64)%2)?130:0;
    for(var rx=-900; rx<900; rx+=260){ x.fillText('PULL HUB / PH-01', rx+off, ry); }
  }
  x.restore();
  x.textAlign='center';
  var ex=W/2, ey=H/2-40;
  g=x.createLinearGradient(ex-150,ey-150,ex+150,ey+150); g.addColorStop(0,'#345be7'); g.addColorStop(1,'#55d4c2');
  x.strokeStyle=g; x.lineWidth=5; x.shadowColor='rgba(52,91,231,0.7)'; x.shadowBlur=22;
  x.beginPath(); x.arc(ex,ey,150,0,Math.PI*2); x.stroke();
  x.lineWidth=1.5; x.beginPath(); x.arc(ex,ey,168,0,Math.PI*2); x.stroke(); x.shadowBlur=0;
  g=x.createRadialGradient(ex,ey,0,ex,ey,86); g.addColorStop(0,'#ffffff'); g.addColorStop(0.5,'#bfeaff'); g.addColorStop(1,'rgba(127,243,255,0)');
  x.fillStyle=g; x.shadowColor='rgba(191,234,255,0.9)'; x.shadowBlur=34;
  star4(x,ex,ey,84); x.fill(); x.shadowBlur=0;
  x.font=fDisplay(58);
  x.fillStyle='#f5f0e6'; x.shadowColor='rgba(52,91,231,0.7)'; x.shadowBlur=22;
  spaced(x,'PULL HUB',ex,ey+266,8); x.shadowBlur=0;

var tUniform={value:0};

function holo(m, strength){
  var amt=(strength==null)?0.18:strength;
  m.onBeforeCompile=function(s){
    s.uniforms.uTime=tUniform;
    s.fragmentShader=s.fragmentShader
      .replace('#include <common>','#include <common>\nuniform float uTime;')
      .replace('#include <emissivemap_fragment>',
        '#include <emissivemap_fragment>\n'+
        'vec3 hVDir=normalize(vViewPosition);\n'+
        'float hFr=pow(1.0-abs(dot(normalize(normal),hVDir)),2.85);\n'+
        'float hBand=sin((vUv.x*5.0+vUv.y*2.5)*3.14159+uTime*0.9+hFr*7.0);\n'+
        'vec3 hRb=0.5+0.5*cos(6.2831*(vec3(0.0,0.33,0.66)+hBand*0.45+uTime*0.03));\n'+
        'totalEmissiveRadiance+=hRb*hFr*'+amt.toFixed(3)+';\n');
  };
  m.customProgramCacheKey=function(){ return 'ph-holo-pack-'+amt; };
}

function pinch(yg){ var t=(yg+PH/2)/PH; if(t<0)t=0; if(t>1)t=1;
  var e=0.09, ea=Math.min(t/e,1), eb=Math.min((1-t)/e,1);
  var sm=Math.min(ea,eb); sm=sm*sm*(3-2*sm);
  return (0.05+0.95*sm)*(0.9+0.1*Math.sin(Math.PI*t)); }
function bow(bx){ var hx=PW/2; if(bx>hx)bx=hx; if(bx<-hx)bx=-hx;
  return 0.9+0.1*Math.cos((bx/hx)*Math.PI/2); }
function frontZAt(y){ return (PD/2)*pinch(y)*bow(0); }
function pinchedBox(w,h,d,cy,sw,sh){
  var geo=new THREE.BoxGeometry(w,h,d,sw,sh,6);
  var pos=geo.attributes.position;
  for(var i=0;i<pos.count;i++){
    pos.setZ(i, pos.getZ(i)*pinch(pos.getY(i)+cy)*bow(pos.getX(i)));

  pos.needsUpdate=true; geo.computeVertexNormals();

}

function remapPackUVs(geo, yCenter){

function deformStrip(geo,orig,yOff,amt){
  var pos=geo.attributes.position, R=1/(CURL_K*openCurl);
  var xF=TEAR_X0+TEAR_SPAN*amt;
  for(var i=0;i<pos.count;i++){
    var ox=orig[i*3], oy=orig[i*3+1], oz=orig[i*3+2];
    var d=xF-ox;
    if(d<=0||amt<=0.001){ pos.setXYZ(i,ox,oy,oz); continue; }
    var v=oy+yOff;
    var th=d/R; var ax,ay;
    if(th<=CURL_MAX){

    } else {
      var rest=d-CURL_MAX*R; th=CURL_MAX;
      ax=xF-R*Math.sin(CURL_MAX)-Math.cos(CURL_MAX)*rest;
      ay=R*(1-Math.cos(CURL_MAX))+Math.sin(CURL_MAX)*rest;
    }
    var nx=ax-v*Math.sin(th);

    var nz=oz-0.22*(1-Math.cos(th))
          +windEff*0.035*Math.sin(tGlobal*2.8+d*4.0)*(th/CURL_MAX);
    pos.setXYZ(i,nx,ny,nz);
  }
  pos.needsUpdate=true;

}

/* ============ トゥイーン ============ */
var tweens=[];
function eOutCubic(k){ return 1-Math.pow(1-k,3); }
function eInOut(k){ return k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; }
function eBack(k){ var c1=1.15; return 1+(c1+1)*Math.pow(k-1,3)+c1*Math.pow(k-1,2); }
function tw(dur,fn,ease,done){ tweens.push({e:0,d:dur,f:fn,z:ease||eOutCubic,c:done}); }
function stepTweens(dt){
  for(var i=tweens.length-1;i>=0;i--){
    var t2=tweens[i]; t2.e+=dt;
    var k=t2.e/t2.d; if(k>1)k=1;
    t2.f(t2.z(k),k);
    if(k>=1){ tweens.splice(i,1); if(t2.c)t2.c(); }
  }
}

}
function hideContinueCta(){
  hintEl.classList.remove('continue');
  hintEl.classList.add('off');
}
function requestExitToResult(){
  if(window.__PH_REVEAL_POSTED__||window.__PH_EXITING__) return;
  if(!revealed) return;
  window.__PH_EXITING__=true;
  mode=null;
  hideContinueCta();
  try{ document.body.classList.add('ph-exiting'); }catch(e){}
  var ms=reduce?CFG.exitFadeReducedMs:CFG.exitFadeMs;
  setTimeout(function(){ postRevealDone(); }, ms);
}

cv.addEventListener('pointerdown',function(e){
  if(window.__PH_EXITING__||window.__PH_REVEAL_POSTED__) return;
  audio();
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  lastX=e.clientX; lastY=e.clientY; dragVel=0; dragVelX=0; pointerMoved=0;
  /* Reveal: card hit → inspect drag (swallows continue); miss → background tap candidate. */
  if(revealed && !window.__PH_REVEAL_POSTED__ && !window.__PH_EXITING__){
    if(hitsCard(e)){
      mode='inspect';
      e.preventDefault();
    } else {
      mode='continueTap';
    }
    return;
  }
  if(!opened && hits(e,tearHit)){
    mode='tear';
    tearHover=true;
    if(tearCueEl) tearCueEl.classList.add('swiping');
    if(sbTok){ sbTok.dead=true; sbTok=null; }
  }
  else if(emerged && !revealed && !flipping && hits(e,cardMesh)){ mode=null; flip(); }
  else if(!revealed){ mode='rotate'; }
});
cv.addEventListener('pointermove',function(e){
  if(!opened && !revealed){ tearHover=hits(e,tearHit) || mode==='tear'; }
  if(!mode) return;
  var dx=e.clientX-lastX, dy=e.clientY-lastY;
  lastX=e.clientX; lastY=e.clientY;
  pointerMoved+=Math.abs(dx)+Math.abs(dy);
  if(mode==='inspect'){
    /* Card-only inspect — never promote to continue on this gesture. */
    e.preventDefault();
    rotT.y+=dx*CFG.inspectScaleY;
    rotT.x+=dy*CFG.inspectScaleX;
    clampInspect();
    dragVel=dx*CFG.inspectScaleY;
    dragVelX=dy*CFG.inspectScaleX;
    return;
  }
  if(mode==='continueTap'){
    /* Off-card: only tap advances; drag past slop cancels continue (no inspect steal). */
    return;
  }
  if(mode==='tear'){
    if(opened) return;
    progress+=Math.abs(dx)/Math.min(cv.clientWidth*CFG.tearWidthFrac,CFG.tearWidthCap);
    if(progress>1) progress=1;
    var tk=Math.floor(progress*9);
    if(tk!==lastTickN){ lastTickN=tk; tick(); buzz(6); }
    if(Math.abs(dx)>1){
      var wp=new THREE.Vector3(-0.68+1.24*progress,TEAR_Y,ZLINE+0.05);
      packRoot.localToWorld(wp);
      burst(wp,CFG.burstTearN,rarityPal(),CFG.burstTearSpd,CFG.burstTearUp);
    }
    if(progress>=1) openPack();
  } else if(mode==='rotate'){
    rotT.y+=dx*CFG.rotScaleY;
    rotT.x+=dy*CFG.rotScaleX;
    if(rotT.x>CFG.rotXClamp)rotT.x=CFG.rotXClamp; if(rotT.x<-CFG.rotXClamp)rotT.x=-CFG.rotXClamp;
    dragVel=dx*CFG.rotScaleY;
    dragVelX=dy*CFG.rotScaleX;
  }
});
function endPointer(e){
  if(window.__PH_EXITING__||window.__PH_REVEAL_POSTED__){ mode=null; return; }
  if(mode==='inspect'){
    /* Swallow: card drag must not fire background continue. */
    if(e) e.preventDefault();
    mode=null;
    return;
  }
  if(mode==='continueTap' && pointerMoved<=CFG.tapSlopPx && revealed && hintEl.classList.contains('continue')){
    requestExitToResult();
  }
  if(mode==='tear' && !opened && progress>0){
    var p0=progress, tok={dead:false}; sbTok=tok;
    tw(CFG.tearSnapBackSec,function(k){ if(tok.dead)return; progress=p0*(1-k); },eOutCubic);
  }
  mode=null;
}
cv.addEventListener('pointerup',endPointer);
cv.addEventListener('pointercancel',endPointer);
cv.addEventListener('pointerleave',function(){ if(mode!=='tear') tearHover=false; });
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
hintEl.addEventListener('click',function(e){
  e.preventDefault(); e.stopPropagation();
  if(revealed && hintEl.classList.contains('continue')) requestExitToResult();
});
hintEl.addEventListener('pointerup',function(e){
  e.preventDefault(); e.stopPropagation();
  if(revealed && hintEl.classList.contains('continue')) requestExitToResult();
});

/* ============ 開封シーケンス ============ */
function flapOpen(){
  tw(reduce?CFG.flapDurReduced:CFG.flapDur,function(k){
    openCurl=1+0.14*k; windA=0.4+0.6*k;
  },eOutCubic,function(){ flapDone=true; });
}
function openPack(){
  if(opened) return;
  opened=true; mode=null;
  cardGroup.visible=true;
  chime(); buzz([12,40,18]);
  spark.visible=false;
  tearHover=false; setTearCueVisible(false);
  flapOpen();
  var wp=new THREE.Vector3(0,TEAR_Y,0.3); packRoot.localToWorld(wp);
  burst(wp,CFG.burstOpenN,rarityPal(),CFG.burstOpenSpd,CFG.burstOpenUp);
  flashVal=CFG.flashOnOpen;
  hint('TAP THE CARD TO REVEAL');
  var c0=camTy;
  tw(CFG.camOpenDur,function(k){ camTy=c0+(CFG.camTyOpen-c0)*k; },eInOut);
  setTimeout(packExit, reduce?CFG.packExitDelayReducedMs:CFG.packExitDelayMs);
  setTimeout(emerge, reduce?CFG.emergeDelayReducedMs:CFG.emergeDelayMs);
}
var emTok=null;
function packExit(){
  tone(196,0.22,'sine',0.05); tone(147,0.28,'sine',0.04,0.06);
  tw(reduce?CFG.packExitDurReduced:CFG.packExitDur,function(k){
    bodyGroup.position.y=BODY_CY-7.8*k;
  },function(k){ return k*k; },function(){ bodyGroup.visible=false; });
}
function emerge(){
  emerged=true; glow.visible=true;
  tone(587.3,0.18,'sine',0.06);
  var tok={dead:false}; emTok=tok;
  tw(reduce?CFG.emergeDurReduced:CFG.emergeDur,function(k){
    if(tok.dead) return;
    cardBaseY=CARD_Y0+0.3*k;
  },eOutCubic);
  setTimeout(centerCard, reduce?CFG.centerDelayReducedMs:CFG.centerDelayMs);
  tw(CFG.glowTweenDur,function(k){
    var s=0.01+CFG.glowPeakScale*k;
    glow.scale.set(s,s*0.82,1);
    glow.material.opacity=CFG.glowOpacity0*(1-CFG.glowOpacityFade*k);
  },eOutCubic);
}
function centerCard(){
  if(centering||centered||!opened) return;
  centering=true;
  if(emTok){ emTok.dead=true; emTok=null; }
  rotT.x=0; rotT.y=0; rotC.x=0; rotC.y=0; dragVel=0; dragVelX=0;
  packRoot.rotation.set(0,0,0);
  scene.attach(cardGroup);
  var p0=cardGroup.position.clone();
  var r0=cardGroup.rotation.clone();
  var s0=cardGroup.scale.x;
  var c0=camTy;
  tw(reduce?CFG.centerDurReduced:CFG.centerDur,function(k){
    cardGroup.position.set(p0.x*(1-k), p0.y+(CARD_CY-p0.y)*k, p0.z+(CARD_CZ-p0.z)*k);
    cardGroup.rotation.set(r0.x*(1-k), r0.y*(1-k), r0.z*(1-k));
    var sc=s0+(CARD_SC-s0)*k; cardGroup.scale.set(sc,sc,sc);
    camTy=c0+(CFG.camTyCenter-c0)*k;
  },eInOut,function(){ centering=false; centered=true; });
}
function flip(){
  if(flipping||revealed||!emerged) return;
  flipping=true;
  var flashed=false;
  tone(392,0.1,'triangle',0.07); buzz(10);
  tw(reduce?CFG.flipDurReduced:CFG.flipDur,function(ek,rk){
    cardInner.rotation.y=Math.PI*(1-ek);
    if(!flashed && rk>=0.5){
      flashed=true; flashVal=CFG.flashOnFlip;
      cardFrontM.map=cardFaceTex;
      var wp=cardGroup.getWorldPosition(new THREE.Vector3());
      burst(wp,CFG.burstFlipN,rarityPal(),CFG.burstFlipSpd,CFG.burstFlipUp);
      tone(1318.5,0.5,'sine',0.15); tone(1975.5,0.7,'sine',0.09,0.09);
      buzz([8,30,20]);
    }
  },eInOut,function(){
    flipping=false; revealed=true;
    hintEl.classList.add('off');
    if(!EMBED){ resetBtn.classList.add('on'); }
    infoEl.classList.add('on');
    /* Inspect is always on; continue cue only in embed → Result. */
    if(EMBED) showContinueCta();
  });
}
function resetAll(){
  opened=false; emerged=false; revealed=false; flipping=false;
  centering=false; centered=false; flapDone=false;
  progress=0; lastTickN=-1; stripFly=null;
  if(sbTok){ sbTok.dead=true; sbTok=null; }
  if(emTok){ emTok.dead=true; emTok=null; }
  rotT.x=0; rotT.y=0; rotC.x=0; rotC.y=0; dragVel=0; dragVelX=0;
  packRoot.rotation.set(0,0,0);
  stripHinge.rotation.set(0,0,0);
  openCurl=1; windA=0; windEff=0; stripDirty=true;
  stripGroup.position.set(STRIP_LX,STRIP_LY,0); stripGroup.rotation.set(0,0,0); stripGroup.visible=true;
  setStripOpacity(1);
  tornF.visible=false; tornBk.visible=false;
  tearHover=false; setTearCueVisible(true);
  slitGlow.material.opacity=0; leakLight.intensity=0;
  window.__PH_SKIP_BUSY__=false;
  window.__PH_REVEAL_POSTED__=false;
  window.__PH_EXITING__=false;
  try{ document.body.classList.remove('ph-exiting'); }catch(e){}
  hideContinueCta();
  for(var rz=0;rz<rayMats.length;rz++){ rayMats[rz].opacity=0; rays[rz].scale.y=1; }
  bodyGroup.visible=true; bodyGroup.position.set(0,BODY_CY,0); bodyGroup.rotation.set(0,0,0);
  packRoot.add(cardGroup); cardGroup.scale.set(SLAB_S0,SLAB_S0,SLAB_S0); cardGroup.visible=false;
  cardBaseY=CARD_Y0; cardGroup.position.set(0,CARD_Y0,0); cardGroup.rotation.set(0,0,0);
  cardInner.rotation.y=Math.PI;
  cardFrontM.map=cardBackTex;
  glow.visible=false; glow.scale.set(0.01,0.01,1); glow.material.opacity=CFG.glowOpacity0;
  var c0=camTy; tw(0.6,function(k){ camTy=c0+(CFG.camTyIdle-c0)*k; },eInOut);
  hint(HINT0); hintEl.classList.remove('off');
  resetBtn.classList.remove('on');
  infoEl.classList.remove('on');
  buzz(8);
}
resetBtn.addEventListener('click',resetAll);

/* ============ メインループ ============ */
applyCardInfo(); loadPhoto();
var clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  var dt=clock.getDelta(); if(dt>0.033)dt=0.033;
  tGlobal+=dt;
  tUniform.value=tGlobal;
  lC.position.set(Math.cos(tGlobal*0.6)*4.2, 1.6+Math.sin(tGlobal*0.4)*1.2, 2.6+Math.sin(tGlobal*0.6)*1.5);
  lM.position.set(Math.cos(tGlobal*0.5+Math.PI)*4.2, 0.6+Math.cos(tGlobal*0.35), 2.4+Math.cos(tGlobal*0.5+Math.PI)*1.5);
  if(mode!=='rotate' && mode!=='inspect'){
    if(!centered&&!centering){
      dragVel=dragVel*0.90-rotT.y*0.016; rotT.y+=dragVel;
      dragVelX=dragVelX*0.90-rotT.x*0.016; rotT.x+=dragVelX;
    } else {
      rotT.y+=dragVel; dragVel*=0.93;
      rotT.x+=dragVelX; dragVelX*=0.93;
    }
  }
  if(revealed) clampInspect();
  var sm=1-Math.exp(-10*dt);
  rotC.x+=(rotT.x-rotC.x)*sm; rotC.y+=(rotT.y-rotC.y)*sm;
  var sway=reduce?0:Math.sin(tGlobal*0.35)*0.05;
  if(!centering&&!centered){ packRoot.rotation.set(rotC.x,rotC.y+sway,0); }
  packRoot.position.y=-0.15+(reduce?0:Math.sin(tGlobal*1.1)*0.05);
  var tearAmt=opened?1:progress;
  if(!opened){
    updateTearCueScreen();
    spark.visible=(progress>0.001)&&(mode==='tear');
    if(spark.visible){
      spark.position.set(TEAR_X0+TEAR_SPAN*progress,TEAR_Y,ZLINE+0.05);
      var ss=0.42+0.14*Math.sin(tGlobal*30);
      spark.scale.set(ss,ss,1);
    }
    slitGlow.material.opacity=progress*0.95;
    leakLight.intensity=progress*2.0;
  } else {
    setTearCueVisible(false);
  }
  if(bodyGroup.visible){
    if(tearAmt>0.001||stripDirty){
      windEff=opened?windA:(reduce?0:progress*0.4);
      deformStrip(stripMesh.geometry,stripOrig,0,tearAmt);
      deformStrip(tabTop.geometry,tabOrig,TAB_TOP_Y,tearAmt);
      stripDirty=tearAmt>0.001;
    }
    slitGlow.scale.x=Math.max(0.02,tearAmt);
    leakLight.position.x=TEAR_X0+TEAR_SPAN*tearAmt*0.5;
  }
  if(opened&&bodyGroup.visible){
    var fl=0.75+0.25*Math.sin(tGlobal*13)+0.1*Math.sin(tGlobal*29);
    slitGlow.material.opacity=0.85*fl;
    leakLight.intensity=2.6*fl+(flashVal>0.2?flashVal:0);
    for(var rq=0;rq<rayMats.length;rq++){
      rayMats[rq].opacity=(0.5+0.3*Math.sin(tGlobal*11+rq*2.1))*(reduce?0.5:1);
      rays[rq].scale.y=0.9+0.12*Math.sin(tGlobal*7+rq);
    }
  }
  if(emerged&&!centering&&!centered){
    cardGroup.position.y=cardBaseY+(reduce?0:Math.sin(tGlobal*1.5)*0.05);
    cardGroup.rotation.z=reduce?0:Math.sin(tGlobal*0.9)*0.02;
  }
  if(centered){
    /* Inspect drives pitch/yaw; keep a tiny idle sway only before reveal. */
    var zWob=(!revealed && !reduce)?Math.sin(tGlobal*0.9)*0.02:0;
    var ySway=revealed?0:sway*0.6;
    cardGroup.position.y=CARD_CY+(reduce||revealed?0:Math.sin(tGlobal*1.5)*0.05);
    cardGroup.rotation.set(rotC.x, rotC.y+ySway, zWob);
  }
  if(emerged && revealed && !reduce && Math.random()<CFG.ambientSparkChance){
    var wp2=new THREE.Vector3((Math.random()-0.5)*1.3,(Math.random()-0.5)*1.9,0.1);
    cardGroup.localToWorld(wp2);
    burst(wp2,1,rarityPal(),0.35,0.35);
  }
  flashL.intensity=flashVal; flashVal*=Math.exp(-dt*CFG.flashDecay);
  stepParticles(dt);
  stars.rotation.y+=dt*0.01;
  stepTweens(dt);
  camera.position.set(0,CFG.camEyeY,camZ);
  camera.lookAt(0,camTy,0);
  renderer.render(scene,camera);
}

/* ============ Pull Hub embed bridge (WebView / iframe) ============ */
var EMBED=false;
try{
  var __qs=new URLSearchParams(window.location.search||'');
  EMBED=__qs.get('embed')==='1';
}catch(e){ EMBED=false; }

function postRevealDone(){
  if(window.__PH_REVEAL_POSTED__) return;
  window.__PH_REVEAL_POSTED__=true;
  try{ hideContinueCta(); }catch(e){}
  try{ hintEl.classList.add('off'); }catch(e){}
  var payload={type:'revealDone'};
  var msg=JSON.stringify(payload);
  try{
    var bridge=window.ReactNativeWebView;
    if(bridge&&typeof bridge.postMessage==='function') bridge.postMessage(msg);
  }catch(e){}
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(msg,'*');
      window.parent.postMessage(payload,'*');
    }
  }catch(e){}
  try{ window.postMessage(msg,'*'); }catch(e){}
}

function mapTierToRarity(tier){
  var t=(tier||'').toLowerCase();
  if(t==='mythic') return 4;
  if(t==='legendary') return 3;
  if(t==='epic') return 2;
  if(t==='base'||t==='common'||t==='rare'||t==='uncommon'||t==='bulk') return 1;
  return 1;
}

function applyEmbedParams(){
  if(!EMBED) return;
  try{
    var qs=new URLSearchParams(window.location.search||'');
    var tier=qs.get('tier');
    var card=qs.get('card');
    var patch={};
    if(tier) patch.rarity=mapTierToRarity(tier);
    if(card) patch.name=String(card).slice(0,120);
    if(Object.keys(patch).length) window.setCard(patch);
  }catch(e){}
  /* Production: no replay / prototype chrome */
  try{
    resetBtn.style.display='none';
    var brand=document.getElementById('brand');
    if(brand){ var bs=brand.querySelector('.bs'); if(bs) bs.textContent='PACK OPENING'; }
  }catch(e){}
}

/** Skip → bypass foil tear only; land on 3D card reveal (flip + burst). Result waits for tap. */
window.__PH_SKIP_OPEN__=function(){
  if(window.__PH_SKIP_BUSY__||window.__PH_EXITING__) return;
  /* Already inspecting — Skip / second tap continues to Result with fade. */
  if(revealed){ requestExitToResult(); return; }
  if(flipping) return;
  window.__PH_SKIP_BUSY__=true;
  try{
    if(sbTok){ sbTok.dead=true; sbTok=null; }
    if(emTok){ emTok.dead=true; emTok=null; }
    mode=null; progress=1;
    tearHover=false; setTearCueVisible(false);
    spark.visible=false;
    hintEl.classList.add('off');

    /* Instantly clear foil wrapper. */
    bodyGroup.visible=false;
    setStripOpacity(0);
    tornF.visible=false; tornBk.visible=false;
    slitGlow.material.opacity=0; leakLight.intensity=0;

    opened=true; emerged=true; flapDone=true;
    centering=false; centered=true;
    packRoot.rotation.set(0,0,0);
    rotT.x=0; rotT.y=0; rotC.x=0; rotC.y=0; dragVel=0; dragVelX=0;
    camTy=CFG.camTyCenter;

    /* Snap card into floating reveal pose (face-down, ready to flip). */
    try{ scene.attach(cardGroup); }catch(e){ packRoot.add(cardGroup); }
    cardGroup.visible=true;
    cardGroup.position.set(0,CARD_CY,CARD_CZ);
    cardGroup.rotation.set(0,0,0);
    cardGroup.scale.set(CARD_SC,CARD_SC,CARD_SC);
    cardBaseY=CARD_CY;
    cardInner.rotation.y=Math.PI;
    cardFrontM.map=cardBackTex;

    glow.visible=true;
    glow.scale.set(CFG.glowPeakScale,CFG.glowPeakScale*0.82,1);
    glow.material.opacity=CFG.glowOpacity0*(1-CFG.glowOpacityFade*0.35);

    chime(); buzz([12,40,18]);
    flashVal=Math.max(flashVal,CFG.flashOnOpen);
    var wp=cardGroup.getWorldPosition(new THREE.Vector3());
    burst(wp,CFG.burstOpenN,rarityPal(),CFG.burstOpenSpd,CFG.burstOpenUp);

    /* Play the flip + rarity pop; continue cue stays until postRevealDone. */
    setTimeout(function(){
      window.__PH_SKIP_BUSY__=false;
      if(!revealed && !flipping) flip();
    }, reduce?20:50);
  }catch(e){
    window.__PH_SKIP_BUSY__=false;
    try{ if(!revealed) flip(); }catch(err){}
  }
};

window.addEventListener('message',function(ev){
  try{
    var raw=ev&&ev.data;
    var data=null;
    if(typeof raw==='string'){
      var t=raw.trim();
      if(!t||(t.charAt(0)!=='{'&&t.charAt(0)!=='[')) return;
      data=JSON.parse(t);
    } else if(raw&&typeof raw==='object'){
      data=raw;
    } else {
      return;
    }
    if(!data||typeof data.type!=='string') return;
    if(data.type==='skip') window.__PH_SKIP_OPEN__();
  }catch(e){}
});

applyEmbedParams();
applyCardInfo();

function refreshN2Textures(){
  try{
    frontTex.image=texFront(); frontTex.needsUpdate=true;
    backTex.image=texBack(); backTex.needsUpdate=true;
    cardBackTex.image=texCardBack(); cardBackTex.needsUpdate=true;
    sampleFace=texCardFront();
    loadPhoto();
    if(labelFrontM&&labelFrontM.map){ labelFrontM.map.image=texLabel(); labelFrontM.map.needsUpdate=true; }
    if(labelBackM&&labelBackM.map){ labelBackM.map.image=texLabelBack(); labelBackM.map.needsUpdate=true; }
    if(chamberBM&&chamberBM.map){ chamberBM.map.image=texChamber(true); chamberBM.map.needsUpdate=true; }
  }catch(e){}
}
function whenN2FontsReady(cb){
  var done=false;
  function go(){ if(done) return; done=true; cb(); }
  try{
    if(document.fonts&&document.fonts.ready){
      document.fonts.ready.then(go);
      setTimeout(go,2800);
      return;
    }
  }catch(e){}
  go();
}
whenN2FontsReady(refreshN2Textures);

loop();
})();
